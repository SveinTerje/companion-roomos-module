name: Companion Module Checks

on:
  push:
  pull_request:

jobs:
  check:
    name: Check module
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Local compile uses Node 22; Companion 5.x hosts the module on Node 26.

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --ignore-engines

      - name: Build
        run: yarn build

      - name: Unit tests
        run: yarn test:unit

      - name: Package module
        run: yarn companion-module-build --output=pkg
